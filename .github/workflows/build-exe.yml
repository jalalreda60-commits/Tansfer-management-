name: Build Windows Executable

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r transfer_management_system/requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          cd transfer_management_system
          pyinstaller ^
            --noconfirm ^
            --windowed ^
            --onefile ^
            --name "TransferManagementSystem" ^
            main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TransferManagementSystem-Windows
          path: transfer_management_system/dist/TransferManagementSystem.exe

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: transfer_management_system/dist/TransferManagementSystem.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
